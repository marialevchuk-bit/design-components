<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect · signal hero</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F4F1;font-family:-apple-system,system-ui,sans-serif}
.stage{width:390px;padding:40px 24px;background:#fff;border-radius:28px;box-shadow:0 10px 30px -12px rgba(10,15,36,.2);display:flex;flex-direction:column;align-items:center;gap:14px}
.hero svg{width:100px;height:100px;display:block;overflow:visible}
.cta{width:100%;height:44px;border-radius:12px;background:#0A0F24;border:none;color:#fff;font:500 16px/1 inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.note{font-size:13px;color:#6B7280;margin-top:18px;text-align:center}</style></head>
<body><div class="stage"><div class="hero"><svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" fill="none" overflow="visible">
<style>@keyframes ecRing{0%,28%{stroke-dashoffset:314;opacity:0}32%{stroke-dashoffset:314;opacity:1}78%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}@keyframes ecTrack{0%,28%{opacity:0}32%,90%{opacity:1}97%,100%{opacity:0}}@keyframes ecGlow{0%,22%{opacity:0}28%,92%{opacity:1}97%,100%{opacity:0}}@keyframes ecFinger{0%{transform:translate(12px,14px);opacity:0}6%{opacity:1}18%{transform:translate(0,0) scale(1)}22%{transform:translate(0,1px) scale(.93)}26%{transform:translate(0,0) scale(1);opacity:1}27%,100%{transform:translate(0,0);opacity:0}}@keyframes ecTap{0%,21%{transform:scale(.3);opacity:0}24%{opacity:.9}38%,100%{transform:scale(1.6);opacity:0}}@keyframes ecBar1{0%,30%{transform:scaleY(0)}36%,92%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}@keyframes ecBar2{0%,36%{transform:scaleY(0)}42%,92%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}@keyframes ecBar3{0%,42%{transform:scaleY(0)}48%,92%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}@keyframes ecBar4{0%,48%{transform:scaleY(0)}54%,92%{transform:scaleY(1)}97%,100%{transform:scaleY(0)}}@keyframes ecDone{0%,76%{opacity:0;transform:scale(.6)}82%{opacity:1;transform:scale(1.08)}86%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}.ec-track{animation:ecTrack 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-ring{stroke-dasharray:314;animation:ecRing 3.4s cubic-bezier(.4,0,.2,1) infinite;transform:rotate(-90deg);transform-origin:56px 56px}.ec-glow{animation:ecGlow 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-finger{transform-box:fill-box;transform-origin:30% 8%;animation:ecFinger 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-tap{transform-box:fill-box;transform-origin:center;animation:ecTap 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-bar1{transform-box:fill-box;transform-origin:50% 100%;animation:ecBar1 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-bar2{transform-box:fill-box;transform-origin:50% 100%;animation:ecBar2 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-bar3{transform-box:fill-box;transform-origin:50% 100%;animation:ecBar3 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-bar4{transform-box:fill-box;transform-origin:50% 100%;animation:ecBar4 3.4s cubic-bezier(.4,0,.2,1) infinite}.ec-done{transform-box:fill-box;transform-origin:center;animation:ecDone 3.4s cubic-bezier(.4,0,.2,1) infinite}@media (prefers-reduced-motion:reduce){.ec-track,.ec-ring,.ec-glow,.ec-finger,.ec-tap,.ec-bar1,.ec-bar2,.ec-bar3,.ec-bar4,.ec-done{animation:none}.ec-ring{stroke-dashoffset:0}.ec-finger,.ec-tap{opacity:0}.ec-bar1,.ec-bar2,.ec-bar3,.ec-bar4{transform:scaleY(1)}.ec-done,.ec-glow{opacity:1}}</style>
<defs><clipPath id="ec-scr"><rect x="-12" y="-22.5" width="24" height="45" rx="3.5"/></clipPath></defs>
<circle cx="56" cy="56" r="50" fill="rgba(10,15,36,0.07)"/>
<circle id="ring-track" class="ec-track" cx="56" cy="56" r="50" stroke="rgba(10,15,36,0.12)" stroke-width="2.5"/>
<circle id="ring-progress" class="ec-ring" cx="56" cy="56" r="50" stroke="#0A0F24" stroke-width="2.5" stroke-linecap="round"/>
<g id="phone-shadow" transform="translate(0 3.5) translate(56 64) scale(1 0.5) rotate(-36)"><rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#8A8D98"/></g>
<g id="phone" transform="translate(56 64) scale(1 0.5) rotate(-36)">
<rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#fff" stroke="#0A0F24" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
<g clip-path="url(#ec-scr)">
<rect x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.04)"/>
<rect id="screen-glow" class="ec-glow" x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.10)"/>
<circle id="tap-ripple" class="ec-tap" cx="0" cy="0" r="7" stroke="#0A0F24" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<g id="signal-track" fill="rgba(10,15,36,0.14)"><rect x="-7.6" y="3" width="2.6" height="4" rx="0.9"/><rect x="-3.4" y="0" width="2.6" height="7" rx="0.9"/><rect x="0.8" y="-3" width="2.6" height="10" rx="0.9"/><rect x="5.0" y="-6" width="2.6" height="13" rx="0.9"/></g>
<g id="signal-bars" fill="#0A0F24"><rect class="ec-bar1" x="-7.6" y="3" width="2.6" height="4" rx="0.9"/><rect class="ec-bar2" x="-3.4" y="0" width="2.6" height="7" rx="0.9"/><rect class="ec-bar3" x="0.8" y="-3" width="2.6" height="10" rx="0.9"/><rect class="ec-bar4" x="5.0" y="-6" width="2.6" height="13" rx="0.9"/></g>
<path id="network-label" d="M-6 12h12" stroke="rgba(10,15,36,0.35)" stroke-width="1.8" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
<g id="done-tick" class="ec-done"><circle cx="0" cy="-14" r="5.5" fill="#0A0F24"/><path d="M-2.4 -14l1.6 1.6 3.2-3.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>
</g></g>
<g id="finger" class="ec-finger"><g transform="translate(47.4 62.6) scale(1.15)">
<path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15V4a2 2 0 0 1 4 0v5.5V9a2 2 0 0 1 4 0v1a2 2 0 0 1 3 1z" fill="#fff"/>
<g stroke="#0A0F24" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
</g></g></g>
</svg></div>
<button class="cta"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="15" width="3.2" height="5" rx="1"/><rect x="8.2" y="11" width="3.2" height="9" rx="1"/><rect x="13.4" y="7" width="3.2" height="13" rx="1"/><rect x="18.6" y="3" width="3.2" height="17" rx="1"/></svg>Connect your eSIM</button>
<div class="note">3.4 s loop · rendered at 100 × 100 pt in the app</div></div></body></html>
