<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lottie Hero Preview</title>
<style>
:root{--bg:#F5F4F1;--card:#fff;--ink:#0A0F24;--muted:#6B7280;--line:rgba(10,15,36,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;padding:32px 16px}
h1{font-size:20px;font-weight:600;text-align:center;margin:0 0 4px}.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 20px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.controls button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px/1 inherit;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:960px;margin:0 auto}
.card{background:var(--card);border-radius:24px;padding:24px 20px 18px;box-shadow:0 10px 30px -12px rgba(10,15,36,.2);display:flex;flex-direction:column;align-items:center;gap:14px}
.step{margin:0;font-size:13px;font-weight:600;color:var(--muted)}.anim{width:100px;height:100px;position:relative;margin:18px 0}.anim>div{position:absolute;inset:-17.857%}
.big .anim{width:200px;height:200px;margin:36px 0}
.file{margin:0;font:12px ui-monospace,monospace;color:var(--muted)}
</style></head><body>
<h1>Lottie hero preview</h1><p class="sub">Playing the actual JSON files</p>
<div class="controls"><button id="replay">Replay</button><button id="slow" aria-pressed="false">0.25× slow motion</button><button id="big" aria-pressed="false">2× size</button><button id="reduced" aria-pressed="false">Reduced motion (final frame)</button></div>
<div class="grid" id="grid">
<section class="card"><p class="step">1 · Activate</p><div class="anim"><div id="a1"></div></div><p class="file">activate-download.json</p></section>
<section class="card"><p class="step">2 · Set up</p><div class="anim"><div id="a2"></div></div><p class="file">setup-toggles.json</p></section>
<section class="card"><p class="step">Choose destination</p><div class="anim"><div id="a3"></div></div><p class="file">choose-destination.json</p></section>
</div>
