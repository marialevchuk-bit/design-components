<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel · flight hero</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F4F1;font-family:-apple-system,system-ui,sans-serif}
.stage{width:390px;padding:40px 24px;background:#fff;border-radius:28px;box-shadow:0 10px 30px -12px rgba(10,15,36,.2);display:flex;flex-direction:column;align-items:center;gap:14px}
.hero svg{width:100px;height:100px;display:block;overflow:visible}
.cta{width:100%;height:44px;border-radius:12px;background:#0A0F24;border:none;color:#fff;font:500 16px/1 inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.note{font-size:13px;color:#6B7280;margin-top:18px;text-align:center}</style></head>
<body><div class="stage"><div class="hero"><svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" fill="none" overflow="visible">
<style>@keyframes etRing{0%,8%{stroke-dashoffset:314;opacity:0}12%{stroke-dashoffset:314;opacity:1}78%{stroke-dashoffset:0;opacity:1}90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}@keyframes etTrack{0%,8%{opacity:0}12%,90%{opacity:1}97%,100%{opacity:0}}@keyframes etGlow{0%,6%{opacity:0}12%,92%{opacity:1}97%,100%{opacity:0}}@keyframes etPlane{0%,14%{transform:translateY(16px);opacity:0}20%{opacity:1}56%{opacity:1}62%,100%{transform:translateY(-6px);opacity:0}}@keyframes etDot1{0%,28%{opacity:0}32%,90%{opacity:1}97%,100%{opacity:0}}@keyframes etDot2{0%,36%{opacity:0}40%,90%{opacity:1}97%,100%{opacity:0}}@keyframes etDot3{0%,46%{opacity:0}50%,90%{opacity:1}97%,100%{opacity:0}}@keyframes etPin{0%,58%{transform:translateY(-5px);opacity:0}64%{transform:translateY(.6px);opacity:1}68%,92%{transform:translateY(0);opacity:1}97%,100%{transform:translateY(0);opacity:0}}.et-track{animation:etTrack 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-ring{stroke-dasharray:314;animation:etRing 3.4s cubic-bezier(.4,0,.2,1) infinite;transform:rotate(-90deg);transform-origin:56px 56px}.et-glow{animation:etGlow 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-plane{animation:etPlane 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-dot1{animation:etDot1 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-dot2{animation:etDot2 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-dot3{animation:etDot3 3.4s cubic-bezier(.4,0,.2,1) infinite}.et-pin{animation:etPin 3.4s cubic-bezier(.4,0,.2,1) infinite}@media (prefers-reduced-motion:reduce){.et-track,.et-ring,.et-glow,.et-plane,.et-dot1,.et-dot2,.et-dot3,.et-pin{animation:none}.et-ring{stroke-dashoffset:0}.et-plane{opacity:0}.et-dot1,.et-dot2,.et-dot3,.et-glow,.et-pin{opacity:1}}</style>
<defs><clipPath id="et-scr"><rect x="-12" y="-22.5" width="24" height="45" rx="3.5"/></clipPath></defs>
<circle cx="56" cy="56" r="50" fill="rgba(10,15,36,0.07)"/>
<circle id="ring-track" class="et-track" cx="56" cy="56" r="50" stroke="rgba(10,15,36,0.12)" stroke-width="2.5"/>
<circle id="ring-progress" class="et-ring" cx="56" cy="56" r="50" stroke="#0A0F24" stroke-width="2.5" stroke-linecap="round"/>
<g id="phone-shadow" transform="translate(0 3.5) translate(56 64) scale(1 0.5) rotate(-36)"><rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#8A8D98"/></g>
<g id="phone" transform="translate(56 64) scale(1 0.5) rotate(-36)">
<rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#fff" stroke="#0A0F24" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
<g clip-path="url(#et-scr)">
<rect x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.04)"/>
<rect id="screen-glow" class="et-glow" x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.10)"/>
<g id="flight-trail" fill="#0A0F24" fill-opacity="0.35"><circle class="et-dot1" cx="0" cy="12" r="1"/><circle class="et-dot2" cx="0" cy="6" r="1"/><circle class="et-dot3" cx="0" cy="0" r="1"/></g>
<g id="plane" class="et-plane"><path d="M0-5.5c.9 0 1.3.9 1.3 1.7v2.5l4.6 2.8v1.5l-4.6-1.4v2.8l1.5 1.2v1.2L0 6l-2.8.8V5.6l1.5-1.2V1.6l-4.6 1.4V1.5l4.6-2.8v-2.5c0-.8.4-1.7 1.3-1.7z" fill="#0A0F24"/></g>
<g id="destination-pin" class="et-pin"><path d="M0-21a4.8 4.8 0 0 1 4.8 4.8c0 3.4-4.8 7.6-4.8 7.6s-4.8-4.2-4.8-7.6A4.8 4.8 0 0 1 0-21z" fill="#0A0F24"/><circle cx="0" cy="-16.2" r="1.8" fill="#fff"/></g>
</g></g>
</svg></div>
<button class="cta"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>View your trip</button>
<div class="note">3.4 s loop · rendered at 100 × 100 pt in the app</div></div></body></html>
