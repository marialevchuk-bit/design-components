<title>eSIM Hero Animations</title>
<style>
:root{--bg:#F5F4F1;--card:#fff;--ink:#0A0F24;--muted:#6B7280;--line:rgba(10,15,36,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,sans-serif;padding:32px 16px 48px}
h1{font-size:20px;font-weight:600;margin:0 0 4px;text-align:center}
.sub{margin:0 0 20px;text-align:center;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.controls button{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px/1 inherit;cursor:pointer}
.controls button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:24px;padding:24px 20px 18px;box-shadow:0 10px 30px -12px rgba(10,15,36,.2);display:flex;flex-direction:column;align-items:center;gap:16px}
.step{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.hero{border:none;background:none;padding:0;cursor:pointer;border-radius:50%}
.hero:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.hero svg{width:100px;height:100px;display:block;overflow:visible}
.cta{width:100%;height:44px;border-radius:12px;background:#0A0F24;border:none;color:#fff;font:500 15px/1 inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.file{margin:0;font:12px ui-monospace,monospace;color:var(--muted)}

<script>
const anims=()=>document.getAnimations();
let slow=false,reduced=false;
const FINAL=2992; // 88 % of the loop: the reduced-motion frame
function apply(){anims().forEach(a=>{a.playbackRate=slow?0.25:1;if(reduced){a.pause();a.currentTime=FINAL}else if(a.playState==='paused'){a.play()}})}
document.getElementById('replay').onclick=()=>{reduced=false;document.getElementById('reduced').setAttribute('aria-pressed','false');anims().forEach(a=>{a.currentTime=0;a.play()});apply()};
document.getElementById('slow').onclick=e=>{slow=!slow;e.currentTarget.setAttribute('aria-pressed',slow);apply()};
document.getElementById('reduced').onclick=e=>{reduced=!reduced;e.currentTarget.setAttribute('aria-pressed',reduced);apply()};
if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.getElementById('reduced').setAttribute('aria-pressed','true')}
</script></body></html>
