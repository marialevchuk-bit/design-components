<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activate · download hero</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F5F4F1;font-family:-apple-system,system-ui,sans-serif}
.stage{width:390px;padding:40px 24px;background:#fff;border-radius:28px;box-shadow:0 10px 30px -12px rgba(10,15,36,.2);display:flex;flex-direction:column;align-items:center;gap:22px}
.hero svg{width:100px;height:100px;display:block;overflow:visible}
.cta{width:100%;height:44px;border-radius:12px;background:#0A0F24;border:none;color:#fff;font:500 16px/1 inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.note{font-size:13px;color:#6B7280;margin-top:18px;text-align:center}</style></head>
<body><div class="stage"><div class="hero"><svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" fill="none" overflow="visible">
<style>@keyframes edFinger{0%{transform:translate(12px,14px);opacity:0}6%{opacity:1}18%{transform:translate(0,0) scale(1)}22%{transform:translate(0,1px) scale(.93)}26%{transform:translate(0,0) scale(1);opacity:1}27%,100%{transform:translate(0,0);opacity:0}}@keyframes edTap{0%,21%{transform:scale(.3);opacity:0}24%{opacity:.9}38%,100%{transform:scale(1.6);opacity:0}}@keyframes edArrow{0%,30%{transform:translateY(-9px);opacity:0}36%{opacity:1}60%{transform:translateY(1px);opacity:1}66%,100%{transform:translateY(1px);opacity:0}}@keyframes edBar{0%,30%{stroke-dashoffset:1;opacity:1}78%{stroke-dashoffset:0}90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}@keyframes edBarTrack{0%,90%{opacity:1}97%,100%{opacity:0}}@keyframes edDone{0%,76%{opacity:0;transform:scale(.6)}82%{opacity:1;transform:scale(1.08)}86%,92%{opacity:1;transform:scale(1)}97%,100%{opacity:0}}@keyframes edGlow{0%,22%{opacity:0}28%,92%{opacity:1}97%,100%{opacity:0}}.ed-finger{transform-box:fill-box;transform-origin:30% 8%;animation:edFinger 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-tap{transform-box:fill-box;transform-origin:center;animation:edTap 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-arrow{animation:edArrow 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-bar{stroke-dasharray:1 1;stroke-dashoffset:1;animation:edBar 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-bartrack{animation:edBarTrack 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-done{transform-box:fill-box;transform-origin:center;animation:edDone 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-glow{animation:edGlow 3.4s cubic-bezier(.4,0,.2,1) infinite}.ed-hero{cursor:pointer;border:none;background:none;padding:0;border-radius:50%;transition:transform .15s ease}.ed-hero:active{transform:scale(.96)}.ed-hero:focus-visible{outline:2px solid #0A0F24;outline-offset:4px}@media (prefers-reduced-motion:reduce){.ed-finger,.ed-tap,.ed-arrow,.ed-bar,.ed-bartrack,.ed-done,.ed-glow{animation:none}.ed-finger,.ed-tap,.ed-arrow{opacity:0}.ed-bar{stroke-dashoffset:0}.ed-done,.ed-glow{opacity:1}}</style>
<defs><clipPath id="ed-scr"><rect x="-12" y="-22.5" width="24" height="45" rx="3.5"/></clipPath></defs>
<g id="hero" transform="translate(56 56) scale(1.8) translate(-56 -62)">
<g id="phone-shadow" transform="translate(0 3.5) translate(56 64) scale(1 0.5) rotate(-36)"><rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#8A8D98"/></g>
<g id="phone" transform="translate(56 64) scale(1 0.5) rotate(-36)">
<rect x="-15" y="-26" width="30" height="52" rx="6.5" fill="#fff" stroke="#0A0F24" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
<g clip-path="url(#ed-scr)">
<rect x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.04)"/>
<rect id="screen-glow" class="ed-glow" x="-12" y="-22.5" width="24" height="45" fill="rgba(10,15,36,0.1)"/>
<circle id="tap-ripple" class="ed-tap" cx="0" cy="0" r="7" stroke="#0A0F24" stroke-width="1.8" vector-effect="non-scaling-stroke"/>
<g id="download-arrow" class="ed-arrow" stroke="#0A0F24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13v12" vector-effect="non-scaling-stroke"/><path d="M-4.5 -5.5l4.5 4.5 4.5-4.5" vector-effect="non-scaling-stroke"/></g>
<path id="progress-track" class="ed-bartrack" d="M-8 5.5h16" stroke="rgba(10,15,36,0.15)" stroke-width="2"/>
<path id="progress-bar" class="ed-bar" d="M-8 5.5h16" pathLength="1" stroke="#0A0F24" stroke-width="2"/>
<g id="done-tick" class="ed-done"><circle cx="0" cy="-7" r="7" fill="#0A0F24"/><path d="M-3 -7l2 2 4-4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></g>
</g></g>
<g class="ed-finger"><g transform="translate(47.4 62.6) scale(1.15)">
<path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15V4a2 2 0 0 1 4 0v5.5V9a2 2 0 0 1 4 0v1a2 2 0 0 1 3 1z" fill="#fff"/>
<g stroke="#0A0F24" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
<path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
</g></g></g>
</g>
</svg></div>
<button class="cta"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10.5l5 5 5-5"/><path d="M5 20h14"/></svg>Activate your eSIM</button>
<div class="note">3.4 s loop · 100 × 100 pt in the app</div></div></body></html>
